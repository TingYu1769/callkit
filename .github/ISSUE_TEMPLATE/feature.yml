name: 功能建议 / Feature request
description: 想要的新功能或改进 / A new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 要解决什么问题 / What problem does it solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想的做法 / Proposed solution
